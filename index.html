                    maxLife: 2.8
                });
            }
        }

        function triggerConfettiShower() {
            stadiumConfettiPool.forEach(c => {
                c.active = true;
                c.mesh.visible = true;
                c.mesh.material.opacity = 1.0;
                c.x = (Math.random() - 0.5) * 12.0;
                c.y = 8.0 + Math.random() * 7.5;
                c.z = G.topZ - 1.5 + Math.random() * 8.0;
                c.vx = (Math.random() - 0.5) * 4.0;
                c.vy = -0.8 - Math.random() * 2.2;
                c.vz = 1.0 + Math.random() * 3.5;
                c.rotX = Math.random() * Math.PI;
                c.rotY = Math.random() * Math.PI;
                c.rotZ = Math.random() * Math.PI;
                c.rotSpeedX = (Math.random() - 0.5) * 9.0;
                c.rotSpeedY = (Math.random() - 0.5) * 9.0;
                c.rotSpeedZ = (Math.random() - 0.5) * 9.0;
                c.life = 0;
                c.maxLife = 2.4 + Math.random() * 1.0;
                c.mesh.position.set(c.x, c.y, c.z);
            });
        }

        function updateStadiumAtmosphere(dt) {
            // 1. 场边 LED 滚屏流动动画 (科技动感流光)
            if (ledTexLeft) ledTexLeft.offset.x -= dt * 0.05;
            if (ledTexRight) ledTexRight.offset.x += dt * 0.05;

            // 2. 漫天金色礼花纸带物理飘落与旋转
            stadiumConfettiPool.forEach(c => {
                if (!c.active) return;
                c.life += dt;
                if (c.life >= c.maxLife || c.y <= 0.08) {
                    c.active = false;
                    c.mesh.visible = false;
                    return;
                }
                const progress = c.life / c.maxLife;
                c.mesh.material.opacity = progress < 0.7 ? 1.0 : (1.0 - progress) / 0.3;

                c.flutterPhase += dt * c.flutterFreq;
                const driftX = Math.sin(c.flutterPhase) * 1.4;
                const driftZ = Math.cos(c.flutterPhase * 0.8) * 0.8;

                c.vy = Math.max(-3.5, c.vy - 4.5 * dt);
                c.x += (c.vx + driftX) * dt;
                c.y += c.vy * dt;
                c.z += (c.vz + driftZ) * dt;

                c.rotX += c.rotSpeedX * dt;
                c.rotY += c.rotSpeedY * dt;
                c.rotZ += c.rotSpeedZ * dt;

                c.mesh.position.set(c.x, c.y, c.z);
                c.mesh.rotation.set(c.rotX, c.rotY, c.rotZ);
            });
        }

        /* ==========================================================================
           8.6 欧冠商业级拟真观众席与助威系统 (Realistic Seated Crowd & Cheering Fans)
           - 拒绝简易圆球，采用欧式专业折叠座椅 (Seat pan + Ergonomic backrest)
           - 3D 拟真人型球迷：俱乐部战袍、多肤色面部、发型/棒球帽、大腿与多种助威手臂姿态
           - 助威长围巾 (Club Scarves) 与 3D 动态飘扬队旗 (Waving Team Flags)
           - 高清真实球迷照片图层结合 (Photorealistic Crowd Billboard Layers)
           - 进球全场起立欢呼动力学 (Goal Standing Ovation Animation)
           ========================================================================== */
        function buildRealisticStadiumCrowd() {
            // 1. 材质定义池 (保证 0 冗余内存开销)
            const concreteMat = new THREE.MeshStandardMaterial({
                color: 0x162032,
                roughness: 0.9,
                metalness: 0.1
            });
            const seatMatBlue = new THREE.MeshStandardMaterial({
                color: 0x1e40af,
                roughness: 0.45,
                metalness: 0.15
            });
            const seatMatNavy = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.5,
                metalness: 0.2
            });

            const skinMats = [
                new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.55 }), // 浅粉肤
                new THREE.MeshStandardMaterial({ color: 0xf5d0b5, roughness: 0.55 }), // 小麦色
                new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.55 }), // 古铜色
                new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.55 })  // 深肤色
            ];
            const hairMats = [
                new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.8 }), // 黑色
                new THREE.MeshStandardMaterial({ color: 0x3f2e21, roughness: 0.8 }), // 深棕
                new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.7 }), // 金褐
                new THREE.MeshStandardMaterial({ color: 0x71717a, roughness: 0.7 })  // 银灰
            ];
            const kitMats = [
                new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 }), // 皇马白
                new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 }), // 阿森纳/利物浦红
                new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 }), // 切尔西蓝
                new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.4 }), // 多特蒙德黄
                new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.4 }), // 凯尔特人绿
                new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 }), // 曼城天蓝
                new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.4 }), // 珊瑚粉红
                new THREE.MeshStandardMaterial({ color: 0x9333ea, roughness: 0.4 })  // 佛罗伦萨紫
            ];
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });

            const seatPanGeo = new THREE.BoxGeometry(0.44, 0.08, 0.38);
            const seatBackGeo = new THREE.BoxGeometry(0.44, 0.38, 0.06);
            const armGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.34, 8);

            function createSingleSpectator(kitIdx, skinIdx, hairIdx, poseType) {
                const group = new THREE.Group();

                // 1. 真实专业立体塑料折叠座椅 (Seat pan & curved backrest)
                const isBlueSeat = (kitIdx % 2 === 0);
                const sMat = isBlueSeat ? seatMatBlue : seatMatNavy;
                const pan = new THREE.Mesh(seatPanGeo, sMat);
                pan.position.set(0, 0.04, 0);
                group.add(pan);

                const back = new THREE.Mesh(seatBackGeo, sMat);
                back.position.set(0, 0.24, -0.17);
                back.rotation.x = -0.15; // 欧式工学微后仰
                group.add(back);

                // 2. 拟真观众躯体 (Fan Humanoid Figure)
                const person = new THREE.Group();
                person.position.set(0, 0.08, 0);

                // 腿部 (坐姿大腿)
                const thighs = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.14, 0.32), pantsMat);
                thighs.position.set(0, 0.07, 0.06);
                person.add(thighs);

                // 躯干战袍 (Torso in club jersey)
                const torso = new THREE.Mesh(new THREE.BoxGeometry(0.40, 0.44, 0.24), kitMats[kitIdx % kitMats.length]);
                torso.position.set(0, 0.36, -0.02);
                torso.castShadow = true;
                person.add(torso);

                // 头部与面部 (Head with flesh tone)
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), skinMats[skinIdx % skinMats.length]);
                head.position.set(0, 0.31, 0);
                torso.add(head);

                // 发型 / 俱乐部棒球帽 (Hair or baseball cap)
                if (hairIdx < 3) {
                    const hair = new THREE.Mesh(
                        new THREE.SphereGeometry(0.136, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.58),
                        hairMats[hairIdx % hairMats.length]
                    );
                    hair.position.set(0, 0.02, 0);
                    head.add(hair);
                } else {
                    const capDome = new THREE.Mesh(
                        new THREE.SphereGeometry(0.138, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.62),
                        kitMats[(kitIdx + 2) % kitMats.length]
                    );
                    head.add(capDome);
                    const visor = new THREE.Mesh(
                        new THREE.BoxGeometry(0.16, 0.025, 0.12),
                        kitMats[(kitIdx + 2) % kitMats.length]
                    );
                    visor.position.set(0, -0.02, 0.14);
                    head.add(visor);
                }

                // 助威手臂 (Arms with active fan poses)
                const armSkinMat = skinMats[skinIdx % skinMats.length];
                const lArm = new THREE.Mesh(armGeo, armSkinMat);
                const rArm = new THREE.Mesh(armGeo, armSkinMat);

                if (poseType === 0) {
                    // 双臂高举欢呼 (V-Victory cheer)
                    lArm.position.set(-0.25, 0.16, 0.02);
                    lArm.rotation.set(-0.2, 0, 0.55);
                    rArm.position.set(0.25, 0.16, 0.02);
                    rArm.rotation.set(-0.2, 0, -0.55);
                } else if (poseType === 1) {
                    // 单臂举拳冲天，左手扶膝
                    lArm.position.set(-0.22, -0.12, 0.12);
                    lArm.rotation.set(1.2, 0, 0.1);
                    rArm.position.set(0.25, 0.18, 0.04);
                    rArm.rotation.set(-0.35, 0, -0.4);
                } else if (poseType === 2) {
                    // 双臂胸前鼓掌 (Clapping)
                    lArm.position.set(-0.16, 0.02, 0.16);
                    lArm.rotation.set(1.0, 0.45, 0);
                    rArm.position.set(0.16, 0.02, 0.16);
                    rArm.rotation.set(1.0, -0.45, 0);
                } else if (poseType === 3) {
                    // 举起俱乐部横幅围巾 (Champions Scarf)
                    lArm.position.set(-0.24, 0.15, 0.02);
                    lArm.rotation.set(-0.1, 0, 0.45);
                    rArm.position.set(0.24, 0.15, 0.02);
                    rArm.rotation.set(-0.1, 0, -0.45);

                    const scarfMat = new THREE.MeshStandardMaterial({
                        color: kitMats[kitIdx % kitMats.length].color,
                        roughness: 0.6,
                        side: THREE.DoubleSide
                    });
                    const scarf = new THREE.Mesh(new THREE.PlaneGeometry(0.88, 0.18), scarfMat);
                    scarf.position.set(0, 0.32, 0.12);
                    torso.add(scarf);
                }

                torso.add(lArm);
                torso.add(rArm);
                group.add(person);

                return {
                    root: group,
                    person,
                    torso,
                    lArm,
                    rArm,
                    poseType,
                    initY: 0.08,
                    animPhase: Math.random() * Math.PI * 2
                };
            }

            function createWavingFlag(x, y, z, rotY, color1, color2) {
                const group = new THREE.Group();
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.04, 0.05, 2.8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 })
                );
                pole.position.set(0, 1.4, 0);
                group.add(pole);

                const flagGeo = new THREE.PlaneGeometry(1.4, 0.88, 8, 4);
                const flagCanvas = document.createElement('canvas');
                flagCanvas.width = 128; flagCanvas.height = 80;
                const fctx = flagCanvas.getContext('2d');
                fctx.fillStyle = color1; fctx.fillRect(0, 0, 128, 80);
                fctx.fillStyle = color2;
                fctx.beginPath();
                fctx.moveTo(0, 0); fctx.lineTo(128, 0); fctx.lineTo(0, 80); fctx.fill();
                const flagTex = new THREE.CanvasTexture(flagCanvas);

                const flagMat = new THREE.MeshStandardMaterial({
                    map: flagTex,
                    roughness: 0.6,
                    side: THREE.DoubleSide
                });
                const flagMesh = new THREE.Mesh(flagGeo, flagMat);
                flagMesh.position.set(0.70, 2.25, 0);
                group.add(flagMesh);

                group.position.set(x, y, z);
                group.rotation.y = rotY;
                scene.add(group);

                stadiumFlags.push({ mesh: flagMesh, geo: flagGeo, phase: Math.random() * Math.PI });
            }

            // ==========================================
            // A. 顶部主看台 (Top Grandstand Behind Goal)
            // ==========================================
            // 1. 三级阶梯混凝土看台基座 (Stepped Concrete Risers)
            const topTiers = [
                { y: 0.28, z: G.topZ - 2.8, h: 0.55, d: 1.1 },
                { y: 0.62, z: G.topZ - 3.8, h: 1.20, d: 1.1 },
                { y: 0.95, z: G.topZ - 4.8, h: 1.85, d: 1.1 }
            ];
            topTiers.forEach(t => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(16.8, t.h, t.d), concreteMat);
                mesh.position.set(0, t.y, t.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });

            // 顶部看台后矮墙
            const topWall = new THREE.Mesh(new THREE.BoxGeometry(16.8, 1.4, 0.28), concreteMat);
            topWall.position.set(0, 2.2, G.topZ - 5.45);
            scene.add(topWall);

            // 2. 顶部看台观众排布 (3 排，每排 14 人 = 42 位真实人形球迷)
            topTiers.forEach((tier, rowIdx) => {
                const count = 14;
                const startX = -6.2;
                const endX = 6.2;
                const stepX = (endX - startX) / (count - 1);
                const surfaceY = tier.y + tier.h / 2;

                for (let i = 0; i < count; i++) {
                    const kit = (i + rowIdx * 3) % kitMats.length;
                    const skin = (i * 2 + rowIdx) % skinMats.length;
                    const hair = (i * 3 + rowIdx * 2) % 5;
                    const pose = (i + rowIdx) % 4;

                    const spec = createSingleSpectator(kit, skin, hair, pose);
                    spec.root.position.set(startX + i * stepX + (Math.random() - 0.5) * 0.08, surfaceY, tier.z);
                    scene.add(spec.root);
                    stadiumSpectators.push(spec);
                }
            });

            // 3. 顶部高清真实球迷切片条带 (Photorealistic Crowd Billboard Layer)
            if (textures.crowd_strip) {
                const topStripGeo = new THREE.PlaneGeometry(16.8, 3.2);
                const topStripMat = new THREE.MeshBasicMaterial({
                    map: textures.crowd_strip,
                    transparent: true,
                    opacity: 0.95,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                const topStripMesh = new THREE.Mesh(topStripGeo, topStripMat);
                topStripMesh.position.set(0, 3.3, G.topZ - 5.35);
                topStripMesh.rotation.x = -0.85;
                scene.add(topStripMesh);
            }

            // 4. 顶部看台 3D 挥舞大队旗
            createWavingFlag(-6.6, 1.85, G.topZ - 4.9, 0.3, '#dc2626', '#ffffff');
            createWavingFlag(0, 1.85, G.topZ - 4.9, 0, '#2563eb', '#eab308');
            createWavingFlag(6.6, 1.85, G.topZ - 4.9, -0.3, '#16a34a', '#ffffff');

            // ==========================================
            // B. 左右边线看台 (Sideline Grandstands)
            // ==========================================
            const sideTiers = [
                { offset: 9.6, y: 0.20, h: 0.40, w: 1.6 },
                { offset: 11.3, y: 0.42, h: 0.84, w: 1.6 },
                { offset: 13.0, y: 0.65, h: 1.30, w: 1.6 }
            ];

            [-1, 1].forEach(dir => {
                // 1. 阶梯基座
                sideTiers.forEach(t => {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, 26.0), concreteMat);
                    mesh.position.set(dir * t.offset, t.y, 1.0);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                });

                // 2. 边线观众排布 (前 2 级阶梯，每级 15 人 = 30 人 × 2 侧 = 60 位人形球迷)
                [sideTiers[0], sideTiers[1]].forEach((tier, rowIdx) => {
                    const count = 15;
                    const startZ = -10.5;
                    const endZ = 12.0;
                    const stepZ = (endZ - startZ) / (count - 1);
                    const surfaceY = tier.y + tier.h / 2;

                    for (let i = 0; i < count; i++) {
                        const kit = (i * 2 + rowIdx + (dir > 0 ? 3 : 0)) % kitMats.length;
                        const skin = (i + rowIdx * 2) % skinMats.length;
                        const hair = (i * 2 + rowIdx) % 5;
                        const pose = (i * 3 + rowIdx) % 4;

                        const spec = createSingleSpectator(kit, skin, hair, pose);
                        spec.root.position.set(dir * tier.offset, surfaceY, startZ + i * stepZ + (Math.random() - 0.5) * 0.1);
                        spec.root.rotation.y = (dir > 0 ? -Math.PI / 2 : Math.PI / 2); // 面朝赛场
                        scene.add(spec.root);
                        stadiumSpectators.push(spec);
                    }
                });

                // 3. 边线第 3 级高台高清真实球迷条带
                if (textures.crowd_strip) {
                    const sideStripGeo = new THREE.PlaneGeometry(24.5, 2.2);
                    const sideStripMat = new THREE.MeshBasicMaterial({
                        map: textures.crowd_strip,
                        transparent: true,
                        opacity: 0.92,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    });
                    const sideStripMesh = new THREE.Mesh(sideStripGeo, sideStripMat);
                    sideStripMesh.position.set(dir * 13.0, 2.0, 1.0);
                    sideStripMesh.rotation.y = (dir > 0 ? -Math.PI / 2 : Math.PI / 2);
                    sideStripMesh.rotation.z = dir * 0.45; // 倾角仰面朝向俯视镜头
                    scene.add(sideStripMesh);
                }

                // 4. 边线 3D 挥舞队旗
                createWavingFlag(dir * 11.3, 0.84, -6.0, dir * 0.8, '#f59e0b', '#0f172a');
                createWavingFlag(dir * 11.3, 0.84, 8.0, dir * 0.8, '#3b82f6', '#ffffff');
            });
        }

        function updateStadiumCrowd(dt, time) {
            const isGoal = (goalCelebrationTimer > 0);

            // 1. 拟真观众起伏与进球起立狂欢 (Standing Ovation)
            stadiumSpectators.forEach(s => {
                s.animPhase += dt * (isGoal ? 12.0 : 2.5);

                if (isGoal) {
                    // 进球瞬间全体立正起立、疯狂挥臂狂欢
                    const jump = Math.abs(Math.sin(s.animPhase)) * 0.22;
                    s.person.position.y = s.initY + 0.46 + jump;
                    s.torso.rotation.x = -0.15;
                    if (s.poseType === 0 || s.poseType === 3) {
                        s.lArm.rotation.x = -0.3 + Math.sin(s.animPhase * 2) * 0.35;
                        s.rArm.rotation.x = -0.3 + Math.cos(s.animPhase * 2) * 0.35;
                    } else if (s.poseType === 1) {
                        s.rArm.rotation.x = -0.4 + Math.sin(s.animPhase * 3) * 0.4;
                    } else {
                        s.lArm.rotation.y = 0.45 + Math.sin(s.animPhase * 3) * 0.25;
                        s.rArm.rotation.y = -0.45 - Math.sin(s.animPhase * 3) * 0.25;
                    }
                } else {
                    // 常态轻微呼吸微动与看台节奏
                    s.person.position.y = s.initY + Math.sin(s.animPhase) * 0.02;
                    s.torso.rotation.x = 0;
                    if (s.poseType === 0) {
                        s.lArm.rotation.x = -0.2 + Math.sin(s.animPhase * 0.8) * 0.06;
                        s.rArm.rotation.x = -0.2 + Math.cos(s.animPhase * 0.8) * 0.06;
                    } else if (s.poseType === 2) {
                        s.lArm.rotation.y = 0.45 + Math.sin(s.animPhase * 1.5) * 0.10;
                        s.rArm.rotation.y = -0.45 - Math.sin(s.animPhase * 1.5) * 0.10;
                    }
                }
            });

            // 2. 队旗迎风摆动动力学 (Vertex Wave Physics)
            const flagFreq = isGoal ? 11.0 : 4.5;
            const flagAmp = isGoal ? 0.20 : 0.09;
            stadiumFlags.forEach(f => {
                f.phase += dt * flagFreq;
                const pos = f.geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const u = pos.getX(i);
                    if (u > 0.08) {
                        const wave = Math.sin(f.phase + u * 4.0) * flagAmp * (u / 1.4);
                        pos.setZ(i, wave);
                    }
                }
                pos.needsUpdate = true;
                f.geo.computeVertexNormals();
            });
        }

        /* ==========================================================================
           9. 电脑防守球员阵容 (橙色门将 + 蓝色 10 号、7 号，绝不自摆乌龙)
           ========================================================================== */
        function buildPlayers() {
            // 1. 橙色门将 (守门员守在门线前: G.topZ + 0.8 = -11.7，绝不前突堵门)
            const keeper = makeHumanoid(0xf97316, 0x1e293b, 0xffffff, 'top_keeper', {
                baseX: 0, baseZ: G.topZ + 0.8, amplitude: 0.9, speed: 1.2, phase: 0
            });
            scene.add(keeper.group);
            characters.push(keeper);

            // 2. 蓝色双后卫 (大禁区线: Z = -6.5，左/右半区反相巡逻，形成动态射门穿透空档)
            const defL = makeHumanoid(0x2563eb, 0xffffff, 0xef4444, 'defender', {
                baseX: -2.8, baseZ: -6.5, amplitude: 1.5, speed: 1.4, phase: 0
            });
            scene.add(defL.group);
            characters.push(defL);

            const defR = makeHumanoid(0x2563eb, 0xffffff, 0xef4444, 'defender', {
                baseX: 2.8, baseZ: -6.5, amplitude: 1.5, speed: 1.4, phase: Math.PI
            });
            scene.add(defR.group);
            characters.push(defR);

            // 3. 蓝色前腰 (中圈上方: Z = -2.5，大范围横向跑动巡逻)
            const mid = makeHumanoid(0x2563eb, 0xffffff, 0xef4444, 'midfielder', {
                baseX: 0, baseZ: -2.5, amplitude: 2.8, speed: 1.2, phase: 1.2
            });
            scene.add(mid.group);
            characters.push(mid);

            // 4. 蓝色后腰/滑铲防守球员 (中圈下方: Z = 3.6，近距离防线)
            const slider = makeHumanoid(0x2563eb, 0xffffff, 0xef4444, 'slider', {
                baseX: 0, baseZ: 3.6, amplitude: 2.2, speed: 1.35, phase: 2.6
            });
            scene.add(slider.group);
            characters.push(slider);
        }

        function makeHumanoid(jersey, shorts, boots, role, cfg = {}) {
            const root = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8 });
            const jerseyMat = new THREE.MeshStandardMaterial({ color: jersey });
            const shortsMat = new THREE.MeshStandardMaterial({ color: shorts });
            const bootsMat = new THREE.MeshStandardMaterial({ color: boots });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.95, 0.48), jerseyMat);
            torso.position.y = 1.35;
            torso.castShadow = true;
            root.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 16), skinMat);
            head.position.y = 0.68;
            torso.add(head);
            const hair = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            hair.position.y = 0.7;
            torso.add(hair);

            const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.7), skinMat);
            lArm.position.set(-0.5, 0.15, 0);
            torso.add(lArm);
            const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.7), skinMat);
            rArm.position.set(0.5, 0.15, 0);
            torso.add(rArm);

            const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.32, 0.44), shortsMat);
            pelvis.position.y = 0.76;
            root.add(pelvis);

            const lLeg = new THREE.Group();
            lLeg.position.set(-0.24, 0.72, 0);
            const lt = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.11, 0.65), skinMat);
            lt.position.y = -0.32;
            lLeg.add(lt);
            const lb = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 0.4), bootsMat);
            lb.position.set(0, -0.68, 0.08);
            lLeg.add(lb);
            root.add(lLeg);

            const rLeg = new THREE.Group();
            rLeg.position.set(0.24, 0.72, 0);
            const rt = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.11, 0.65), skinMat);
            rt.position.y = -0.32;
            rLeg.add(rt);
            const rb = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 0.4), bootsMat);
            rb.position.set(0, -0.68, 0.08);
            rLeg.add(rb);
            root.add(rLeg);

            root.position.set(cfg.baseX || 0, 0, cfg.baseZ || 0);

            return {
                group: root,
                torso, lArm, rArm, lLeg, rLeg,
                role,
                baseX: cfg.baseX || 0,
                baseZ: cfg.baseZ || 0,
                amplitude: cfg.amplitude || 0,
                speed: cfg.speed || 1.2,
                phase: cfg.phase || 0,
                time: cfg.phase || 0,
                isSliding: false,
                kickCooldown: 0
            };
        }

        /* ==========================================================================
           10. 动力学物理步进（暴击 + 子弹时间 + 失败胜负闭环）
           ========================================================================== */
        function physicsTick(dt) {
            let simDt = dt;
            // 进球后的庆祝慢动作，射门冲刺过程绝不提前减速！
            if (goalCelebrationTimer > 0) {
                goalCelebrationTimer -= dt;
                simDt = dt * 0.35;
            }

            const SUB_STEPS = 8;
            const subDt = simDt / SUB_STEPS;

            for (let s = 0; s < SUB_STEPS; s++) {
                // 1. 微步高频更新双挡杆
                updateSingleFlipper(leftFlipper, false, subDt);
                updateSingleFlipper(rightFlipper, true, subDt);

                // 2. 足球微步动力学
                if (goalState.active) {
                    // 进球立体球门腔体内：3D 飞行与重力自然滑落
                    ball.vy += -18.0 * subDt;
                    ball.y += ball.vy * subDt;
                    if (ball.y < G.ballR) {
                        ball.y = G.ballR;
                        ball.vy = -ball.vy * 0.28; // 落地轻微弹跳并止步
                        ball.vx *= (1 - 6.0 * subDt);
                        ball.vz *= (1 - 6.0 * subDt);
                    }
                    ball.x += ball.vx * subDt;
                    ball.z += ball.vz * subDt;

                    // 球门内壁硬边界保护（防止极端暴击下穿透顶网或侧网飞出看台）
                    const maxInnerX = 3.3 - G.ballR;
                    if (ball.x < -maxInnerX) { ball.x = -maxInnerX; ball.vx = -ball.vx * 0.35; }
                    if (ball.x > maxInnerX) { ball.x = maxInnerX; ball.vx = -ball.vx * 0.35; }
                    if (ball.y > 2.75 - G.ballR) { ball.y = 2.75 - G.ballR; ball.vy = -ball.vy * 0.35; }
                    if (ball.z < G.topZ - 2.2 - 0.45) { ball.z = G.topZ - 2.2 - 0.45; ball.vz = Math.max(0, -ball.vz * 0.25); }

                    // 真实球网柔体碰撞与阻尼吸能
                    const hits = topGoalNet.update(subDt, ball);
                    if (hits > 0 && !goalState.netSoundPlayed) {
                        goalState.netSoundPlayed = true;
                        Sound.play('net_impact', 1.0);
                        screenShake = Math.max(screenShake, 0.45);
                        spawnSparks(ball.x, ball.y, ball.z, 0xffffff);
                    }
                } else {
                    // 球场台面动力学：向上射门时保持充沛强劲冲量（仅微弱阻力），向下回落时全重力滑落
                    const effectiveGravity = (ball.vz < 0) ? 1.4 : G.tableTiltGravityZ;
                    ball.vz += effectiveGravity * subDt;
                    ball.x += ball.vx * subDt;
                    ball.z += ball.vz * subDt;
                    ball.y = G.ballR;
                    ball.vy = 0;

                    // 微步空气阻力
                    ball.vx *= (1 - 0.002 * subDt * 60);
                    ball.vz *= (1 - 0.002 * subDt * 60);

                    // 连续扫掠与反面拓扑硬投影防穿模检测（0 穿模保证）
                    checkFlipperImpactSubstep(leftFlipper, false);
                    checkFlipperImpactSubstep(rightFlipper, true);

                    // 护栏反弹检测
                    for (let i = 0; i < walls.length; i++) {
                        checkWallBounce(walls[i]);
                    }
                }
            }

            // 平衡态网面微步衰减与进球阶段计时
            if (!goalState.active) {
                topGoalNet.update(simDt, ball);
            } else {
                goalState.timer -= dt;
                if (goalState.timer <= 0) {
                    goalState.active = false;
                    topGoalNet.reset();
                    resetBall();
                }
            }

            ball.speed = Math.hypot(ball.vx, ball.vz);

            // 击中挡杆飞出后的 1~1.5 秒破空气流与立体烟雾拖尾
            if (ballSlipstreamTimer > 0 && !goalState.active) {
                ballSlipstreamTimer -= simDt;
                const ratio = Math.max(0, ballSlipstreamTimer / 1.35); // 1.0 -> 0.0

                const distMoved = Math.hypot(ball.x - lastTrailX, ball.z - lastTrailZ);
                if (distMoved >= 0.22 || ballSlipstreamTimer >= 1.30) {
                    lastTrailX = ball.x;
                    lastTrailZ = ball.z;

                    trailVortexSide = -trailVortexSide;
                    const speed = Math.hypot(ball.vx, ball.vz) || 1;
                    const perpX = (-ball.vz / speed) * 0.22 * trailVortexSide;
                    const perpZ = (ball.vx / speed) * 0.22 * trailVortexSide;

                    const puffColor = ballSlipstreamCrit ? (trailVortexSide > 0 ? 0xfef08a : 0xffffff) : 0xf1f8ff;
                    const baseOp = (ballSlipstreamCrit ? 0.85 : 0.72) * (0.35 + 0.65 * ratio);

                    // 主破空气流云团
                    spawnSmokePuff(
                        ball.x + perpX * 0.4,
                        0.52 + (Math.random() - 0.5) * 0.10,
                        ball.z + perpZ * 0.4,
                        perpX * 1.5 - ball.vx * 0.05,
                        0.8 + Math.random() * 0.6,
                        perpZ * 1.5 - ball.vz * 0.05,
                        0.60,
                        1.60 + Math.random() * 0.40,
                        baseOp,
                        0.46 + Math.random() * 0.14,
                        puffColor
                    );

                    // 伴随的微细破空空气涡流羽流
                    if (Math.random() > 0.35) {
                        spawnSmokePuff(
                            ball.x - perpX * 0.7,
                            0.55,
                            ball.z - perpZ * 0.7,
                            -perpX * 2.0,
                            1.1,
                            -perpZ * 2.0,
                            0.38,
                            1.10,
                            baseOp * 0.65,
                            0.36,
                            0xffffff
                        );
                    }
                }
            } else if (ball.speed > 22.0 && !goalState.active) {
                spawnTrailParticle(ball.x, ball.z);
            }

            if (comboCount > 0) {
                comboResetTimer -= simDt;
                if (comboResetTimer <= 0) {
                    comboCount = 0;
                    document.getElementById('combo-badge').classList.remove('show');
                }
            }

            if (!goalState.active) {
                for (let i = 0; i < characters.length; i++) {
                    updateCPUDefender(characters[i], simDt);
                }
            }

            // 进球与漏球判定
            if (!goalState.active) {
                if (ball.z < G.topZ + 0.3) {
                    if (Math.abs(ball.x) < 3.25) {
                        // 进球！开启 1.65 秒慢动作定格与真实冲网物理
                        goalState.active = true;
                        goalState.timer = 1.65;
                        goalState.netSoundPlayed = false;
                        scoreP1++;
                        document.getElementById('score-p1').innerText = scoreP1;
                        triggerGoal();
                    } else {
                        // 出界或击中球门侧柱外侧，直接重置
                        resetBall();
                    }
                } else if (ball.z > 16.0) {
                    scoreCPU++;
                    document.getElementById('score-cpu').innerText = scoreCPU;
                    triggerDrain();
                    resetBall();
                }
            }

            ball.mesh.position.set(ball.x, ball.y, ball.z);
            ball.mesh.rotation.x += ball.vz * simDt * 2.2;
            ball.mesh.rotation.z -= ball.vx * simDt * 2.2;
        }

        function updateSingleFlipper(f, isRight, dt) {
            f.targetAngle = isRight ? (keyState.right ? -G.activeAngle : -G.restAngle)
                                    : (keyState.left ? G.activeAngle : G.restAngle);
            const prevA = f.angle;
            f.angle += (f.targetAngle - f.angle) * Math.min(1.0, dt * G.strikeSpeed);
            f.omega = (f.angle - prevA) / dt;
            f.mesh.rotation.y = -f.angle;
        }

        function checkWallBounce(w) {
            const dx = w.x2 - w.x1;
            const dz = w.z2 - w.z1;
            const lenSq = dx * dx + dz * dz;
            const t = Math.max(0, Math.min(1, ((ball.x - w.x1) * dx + (ball.z - w.z1) * dz) / lenSq));
            const cx = w.x1 + t * dx;
            const cz = w.z1 + t * dz;
            const dist = Math.hypot(ball.x - cx, ball.z - cz);
            const totalR = G.ballR + w.r;

            if (dist < totalR) {
                const nx = (ball.x - cx) / (dist || 1);
                const nz = (ball.z - cz) / (dist || 1);

                ball.x = cx + nx * totalR;
                ball.z = cz + nz * totalR;

                const dot = ball.vx * nx + ball.vz * nz;
                if (dot < 0) {
                    ball.vx -= 1.88 * dot * nx;
                    ball.vz -= 1.88 * dot * nz;

                    comboCount++;
                    comboResetTimer = 2.0;
                    Sound.playComboNote(comboCount);
                    Sound.play('bounce', 0.7, 1.0 + Math.min(0.5, comboCount * 0.05));

                    const badge = document.getElementById('combo-badge');
                    badge.innerText = `🔥 COMBO x${comboCount}`;
                    badge.classList.add('show');
                }
            }
        }

        function checkFlipperImpactSubstep(f, isRight) {
            // 严格欧拉变换坐标：左推杆向右下，右推杆向左下；抬起时向场内上方旋转
            const dirX = isRight ? -Math.cos(f.angle) : Math.cos(f.angle);
            const dirZ = isRight ? -Math.sin(f.angle) : Math.sin(f.angle);
            const tx = f.px + dirX * G.flipperL;
            const tz = f.pz + dirZ * G.flipperL;

            // 打击面朝向球场的单位法线（统一指向场内上方 -Z）
            const nx = Math.sin(f.angle);
            const nz = -Math.cos(f.angle);

            const dx = tx - f.px;
            const dz = tz - f.pz;
            const lenSq = dx * dx + dz * dz;
            const t = ((ball.x - f.px) * dx + (ball.z - f.pz) * dz) / lenSq;
            const tClamp = Math.max(0, Math.min(1, t));
            const cx = f.px + tClamp * dx;
            const cz = f.pz + tClamp * dz;
            const dist = Math.hypot(ball.x - cx, ball.z - cz);

            // 球在打击面前方的带符号垂直距离（正为前方，负为穿透后方）
            const sDist = (ball.x - cx) * nx + (ball.z - cz) * nz;
            const hitR = G.ballR + 0.38;

            // 碰撞判定：常规包围盒触碰 OR 沿杆身穿透至后方（连续防穿透双重拓扑）
            const hasPenetrated = (t >= -0.15 && t <= 1.15 && sDist < 0.05 && dist < hitR * 1.85);
            if (dist < hitR || hasPenetrated) {
                // 强制将球纠偏至打击面正前方，绝不后退穿模！
                ball.x = cx + nx * hitR;
                ball.z = cz + nz * hitR;

                const isSwingingUp = isRight ? (f.omega > 0.4) : (f.omega < -0.4);
                if (isSwingingUp) {
                    const isSweetSpot = t > 0.55;
                    const boostPower = isSweetSpot ? 52.0 : 38.0;

                    ball.vx = nx * (isSweetSpot ? 26.0 : 18.0) + (isRight ? -6.0 : 6.0);
                    ball.vz = -boostPower;

                    // 击中挡杆飞出的一瞬间：激活 1.35 秒破空烟雾与气流拖尾！
                    ballSlipstreamTimer = 1.35;
                    ballSlipstreamCrit = isSweetSpot;
                    lastTrailX = ball.x;
                    lastTrailZ = ball.z;
                    spawnImpactSmokeBurst(ball.x, ball.z, nx, nz, isSweetSpot);

                    screenShake = isSweetSpot ? 0.8 : 0.4;
                    Sound.play(isSweetSpot ? 'kick_crit' : 'kick', 1.0, isSweetSpot ? 1.0 : 1.1);
                    spawnSparks(ball.x, 0.5, ball.z, isSweetSpot ? 0xfacc15 : 0xffffff);

                    if (isSweetSpot) {
                        const crit = document.getElementById('crit-banner');
                        crit.classList.add('show');
                        setTimeout(() => crit.classList.remove('show'), 600);
                    }
                } else {
                    const dot = ball.vx * nx + ball.vz * nz;
                    if (dot < 0) {
                        ball.vx -= 1.82 * dot * nx;
                        ball.vz -= 1.82 * dot * nz;
                        Sound.play('bounce', 0.85);

                        // 强劲弹离亦激发气流拖尾
                        if (ball.vz < -12.0) {
                            ballSlipstreamTimer = 1.0;
                            ballSlipstreamCrit = false;
                            lastTrailX = ball.x;
                            lastTrailZ = ball.z;
                            spawnImpactSmokeBurst(ball.x, ball.z, nx, nz, false);
                        }
                    }
                    if (ball.vz > -3.0) ball.vz = -3.0; // 保证弹离，不陷落
                }
            }
        }

        function updateCPUDefender(c, dt) {
            c.time += dt * c.speed;
            if (c.kickCooldown > 0) c.kickCooldown -= dt;
            const pos = c.group.position;

            if (c.role === 'top_keeper') {
                // 门将：平时在门线中心区域热身微调，绝无磁吸吸附！
                let targetX = c.amplitude * Math.sin(c.time * 0.8);

                // 只有当足球真正朝球门飞来（射门且速度较快、进入上半场）时，门将才激活拦截扑救
                if (ball.vz < -7.0 && ball.z < 2.0) {
                    const timeToGoal = Math.max(0.05, (c.baseZ - ball.z) / ball.vz);
                    const predictedX = ball.x + ball.vx * timeToGoal;
                    // 扑救范围限制在球门内 [-2.3, 2.3]
                    targetX = Math.max(-2.3, Math.min(2.3, predictedX));

                    // 扑救张臂动作
                    c.lArm.rotation.z = -0.8;
                    c.rArm.rotation.z = 0.8;
                } else {
                    c.lArm.rotation.z = 0;
                    c.rArm.rotation.z = 0;
                    c.lArm.rotation.x = Math.sin(c.time * 2.0) * 0.3 - 0.2;
                    c.rArm.rotation.x = -Math.sin(c.time * 2.0) * 0.3 - 0.2;
                }

                pos.x += (targetX - pos.x) * Math.min(1.0, dt * 5.0);
            } 
            else {
                // 场上球员：严格按照桌式足球/弹珠台阵型战术自主巡逻，彻底解除磁吸！
                // 左右自然开合，给玩家留出可预测、可瞄准的时机空档！
                pos.x = c.baseX + c.amplitude * Math.sin(c.time);
                pos.z = c.baseZ;

                // 拟真跑步摆动动画
                c.lLeg.rotation.x = Math.sin(c.time * 2.5) * 0.6;
                c.rLeg.rotation.x = -Math.sin(c.time * 2.5) * 0.6;
                c.lArm.rotation.x = -Math.sin(c.time * 2.5) * 0.5;
                c.rArm.rotation.x = Math.sin(c.time * 2.5) * 0.5;

                // 滑铲球员如果球在附近迎面冲来，触发滑铲动作
                if (c.role === 'slider') {
                    const d = Math.hypot(ball.x - pos.x, ball.z - pos.z);
                    if (d < 2.4 && !c.isSliding && ball.vz < 0) {
                        c.isSliding = true;
                        setTimeout(() => { c.isSliding = false; }, 650);
                    }
                    if (c.isSliding) {
                        c.torso.rotation.x = 0.85;
                        c.rLeg.rotation.x = -1.35;
                        c.lLeg.rotation.x = 0.4;
                    } else {
                        c.torso.rotation.x = 0;
                    }
                }
            }

            // 局部触球解围判定（只有当足球真实撞击在球员身体范围内才解围反弹，绝无远程吸力）
            const dist = Math.hypot(ball.x - pos.x, ball.z - pos.z);
            const tackleRadius = (c.role === 'top_keeper') ? (G.ballR + 0.38) : (G.ballR + 0.65);
            if (dist < tackleRadius && c.kickCooldown <= 0) {
                // 物理分离，避免黏连
                const angle = Math.atan2(ball.z - pos.z, ball.x - pos.x);
                ball.x = pos.x + Math.cos(angle) * tackleRadius;
                ball.z = pos.z + Math.sin(angle) * tackleRadius;

                // 永远向下解围（回传给玩家推杆，施加防守反击压力，绝不自摆乌龙）
                const kickSpeed = (c.role === 'top_keeper') ? 22.0 : 16.0;
                ball.vx = (Math.random() - 0.5) * 12.0;
                ball.vz = kickSpeed;
                c.kickCooldown = 0.75;
                ballSlipstreamTimer = 0; // 防守球员成功解围后，向上破空拖尾自然终止

                screenShake = 0.28;
                Sound.play('kick', 1.0, 0.95);
                spawnSparks(ball.x, 0.5, ball.z, 0x60a5fa);
            }
        }

        function spawnTrailParticle(x, z) {
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 6, 6),
                new THREE.MeshBasicMaterial({ color: (currentSkin === 'magma' ? 0xef4444 : 0x38bdf8), transparent: true, opacity: 0.8 })
            );
            p.position.set(x, 0.5, z);
            scene.add(p);
            ballTrailParticles.push({ mesh: p, life: 0.35 });
        }

        function spawnSparks(x, y, z, color) {
            for (let i = 0; i < 14; i++) {
                const sp = new THREE.Mesh(
                    new THREE.SphereGeometry(0.12, 6, 6),
                    new THREE.MeshBasicMaterial({ color })
                );
                sp.position.set(x, y, z);
                scene.add(sp);
                particles.push({
                    mesh: sp,
                    vx: (Math.random() - 0.5) * 12,
                    vy: Math.random() * 8 + 2,
                    vz: (Math.random() - 0.5) * 12,
                    life: 1.0
                });
            }
        }

        function updateParticles(dt) {
            for (let i = ballTrailParticles.length - 1; i >= 0; i--) {
                const tp = ballTrailParticles[i];
                tp.life -= dt * 3.5;
                tp.mesh.scale.setScalar(Math.max(0.01, tp.life * 2.0));
                tp.mesh.material.opacity = tp.life * 2.0;
                if (tp.life <= 0) {
                    scene.remove(tp.mesh);
                    ballTrailParticles.splice(i, 1);
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt * 3.5;
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                p.vy -= 16 * dt;
                p.mesh.scale.setScalar(Math.max(0.01, p.life));
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        function triggerGoal() {
            screenShake = 1.0;
            goalCelebrationTimer = 1.65;
            Sound.play('goal', 1.0);
            setTimeout(() => Sound.play('whistle', 0.85), 320);
            const b = document.getElementById('goal-banner');
            b.classList.add('show');
            spawnSparks(0, 1.5, G.topZ, 0xfacc15);
            triggerConfettiShower();
            setTimeout(() => b.classList.remove('show'), 1500);
        }

        function triggerDrain() {
            screenShake = 0.6;
            Sound.play('drain', 1.0);
            setTimeout(() => Sound.play('whistle', 0.65), 280);
            const b = document.getElementById('drain-banner');
            b.classList.add('show');
            setTimeout(() => b.classList.remove('show'), 1200);
        }

        /* ==========================================================================
           11. 交互与控制
           ========================================================================== */
        function setupControls() {
            window.addEventListener('keydown', e => {
                if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
                    if (!keyState.left) Sound.play('flipper', 0.8);
                    keyState.left = true;
                }
                if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
                    if (!keyState.right) Sound.play('flipper', 0.8);
                    keyState.right = true;
                }
                if (e.code === 'Space') resetBall();
                if (e.key === 'g' || e.key === 'G') {
                    // G 键：直接触发向球门内爆射物理测试
                    ball.x = (Math.random() - 0.5) * 1.2;
                    ball.y = 1.2;
                    ball.z = -7.5;
                    ball.vx = (Math.random() - 0.5) * 4.0;
                    ball.vy = 2.2;
                    ball.vz = -28.0;
                    ballSlipstreamTimer = 1.35;
                    ballSlipstreamCrit = true;
                    Sound.play('kick_crit', 1.0);
                }
                if (e.key === 'c' || e.key === 'C' || e.key === 'p' || e.key === 'P') {
                    setPitchStyle(currentPitchStyleIdx + 1);
                }
            });

            window.addEventListener('keyup', e => {
                if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keyState.left = false;
                if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keyState.right = false;
            });

            const tLeft = document.getElementById('touch-left');
            const tRight = document.getElementById('touch-right');

            tLeft.addEventListener('pointerdown', () => { Sound.play('flipper', 0.8); keyState.left = true; });
            tLeft.addEventListener('pointerup', () => { keyState.left = false; });
            tLeft.addEventListener('pointercancel', () => { keyState.left = false; });

            tRight.addEventListener('pointerdown', () => { Sound.play('flipper', 0.8); keyState.right = true; });
            tRight.addEventListener('pointerup', () => { keyState.right = false; });
            tRight.addEventListener('pointercancel', () => { keyState.right = false; });

            document.getElementById('btn-reset').addEventListener('click', resetBall);
            document.getElementById('btn-sound').addEventListener('click', () => {
                Sound.enabled = !Sound.enabled;
                document.getElementById('btn-sound').innerText = Sound.enabled ? '🔊' : '🔇';
            });
            const btnPitch = document.getElementById('btn-pitch');
            if (btnPitch) {
                btnPitch.innerText = PITCH_STYLES[currentPitchStyleIdx].icon;
                btnPitch.title = `切换草坪 (当前: ${PITCH_STYLES[currentPitchStyleIdx].name})`;
                btnPitch.addEventListener('click', () => {
                    setPitchStyle(currentPitchStyleIdx + 1);
                });
            }
            document.getElementById('btn-skin').addEventListener('click', () => {
                if (currentSkin === 'classic') {
                    currentSkin = 'magma';
                    if (textures.magma) {
                        ball.mesh.material.map = textures.magma;
                        ball.mesh.material.needsUpdate = true;
                    }
                } else {
                    currentSkin = 'classic';
                    if (textures.classic) {
                        ball.mesh.material.map = textures.classic;
                        ball.mesh.material.needsUpdate = true;
                    }
                }
            });

            document.getElementById('btn-cover').addEventListener('click', () => {
                document.getElementById('modal-cover').classList.add('active');
            });
            document.getElementById('btn-share').addEventListener('click', () => {
                document.getElementById('modal-share').classList.add('active');
            });
        }

        window.closeModals = function() {
            document.getElementById('modal-cover').classList.remove('active');
            document.getElementById('modal-share').classList.remove('active');
        };

        /* ==========================================================================
           12. 渲染循环与相机物理微震
           ========================================================================== */
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.033);

            physicsTick(dt);
            updateParticles(dt);
            updateSmokeSystem(dt);
            updateStadiumAtmosphere(dt);
            updateStadiumCrowd(dt, clock.getElapsedTime());

            if (screenShake > 0.01) {
                camera.position.x = baseCamPos.x + (Math.random() - 0.5) * screenShake * 0.8;
                camera.position.z = baseCamPos.z + (Math.random() - 0.5) * screenShake * 0.8;
                screenShake *= 0.88;
            } else {
                camera.position.copy(baseCamPos);
            }

            if (bulletTimeTimer > 0) {
                camera.position.y += (42.0 - camera.position.y) * dt * 4.0;
                camera.position.z += (5.0 - camera.position.z) * dt * 4.0;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
