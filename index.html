<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Soccer Pinball 3D - 纯净原生还原版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1322; /* 还原第一版纯净高级的深空夜场 Slate 蓝底色 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* 顶部紧凑超薄记分牌（移至最顶端，严禁遮挡下方球门） */
        #scoreboard {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.92);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 3px 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 10;
            pointer-events: none;
        }
        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 42px;
        }
        .team-name {
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 1px;
        }
        .team-score {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            font-family: "SF Mono", "Courier New", Courier, monospace;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            line-height: 1.1;
        }
        .score-divider {
            font-size: 15px;
            font-weight: bold;
            color: #475569;
            margin: 0 10px;
        }

        /* 连击 Combo 移至左上角，彻底移出球门中心视线 */
        #combo-badge {
            position: absolute;
            top: 10px;
            left: 14px;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            color: #ffffff;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 15;
            transform: scale(0.8);
        }
        #combo-badge.show {
            opacity: 1;
            transform: scale(1);
        }

        /* 暴击提示（靠右显示，不挡门） */
        #crit-banner {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            color: #38bdf8;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.9);
            letter-spacing: 2px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 25;
        }
        #crit-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* 进球与失误横幅 */
        #goal-banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            color: #facc15;
            text-shadow: 0 0 35px rgba(250, 204, 21, 0.9), 0 4px 10px rgba(0,0,0,0.9);
            letter-spacing: 3px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
        }
        #goal-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.15);
        }

        #drain-banner {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 32px;
            font-weight: 900;
            color: #ef4444;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
        }
        #drain-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* 草坪切换优雅毛玻璃浮动 Toast */
        #pitch-toast {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px) scale(0.9);
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 13px;
            font-weight: 800;
            padding: 5px 18px;
            border-radius: 999px;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 45;
            white-space: nowrap;
        }
        #pitch-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* 右上角极简工具按钮 */
        #mini-tools {
            position: absolute;
            top: 8px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 20;
        }
        .tool-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: all 0.2s ease;
        }
        .tool-btn:hover {
            background: rgba(59, 130, 246, 0.9);
            transform: scale(1.1);
        }

        /* 全屏透明触控 */
        #touch-left, #touch-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 5;
            -webkit-tap-highlight-color: transparent;
        }
        #touch-left { left: 0; }
        #touch-right { right: 0; }

        /* 弹窗样式 */
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-card img {
            border-radius: 10px;
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        .modal-title { color: #f8fafc; font-size: 15px; font-weight: 800; margin-bottom: 10px; }
        .modal-btn {
            margin-top: 12px; background: #2563eb; color: white; border: none;
            padding: 8px 24px; border-radius: 999px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 紧凑不遮挡记分牌 -->
        <div id="scoreboard">
            <div class="team-box">
                <span class="team-name">P1 玩家</span>
                <span class="team-score" id="score-p1">2</span>
            </div>
            <div class="score-divider">:</div>
            <div class="team-box">
                <span class="team-name">CPU 电脑</span>
                <span class="team-score" id="score-cpu">0</span>
            </div>
        </div>

        <!-- 连击提示 (移到左上角) -->
        <div id="combo-badge">🔥 COMBO x2</div>
        <div id="crit-banner">ROCKET SHOT! 🚀💥</div>
        <div id="goal-banner">GOOOAL! ⚽🎉</div>
        <div id="drain-banner">DRAINED! 💔 漏球丢分</div>
        <div id="pitch-toast">🌿 经典斑马横条纹</div>

        <!-- 工具栏 -->
        <div id="mini-tools">
            <button class="tool-btn" id="btn-sound" title="音效">🔊</button>
            <button class="tool-btn" id="btn-pitch" title="切换草坪 (🌿/🏁/💎)">🌿</button>
            <button class="tool-btn" id="btn-skin" title="换球皮">⚽</button>
            <button class="tool-btn" id="btn-cover" title="海报">🖼️</button>
            <button class="tool-btn" id="btn-share" title="战报">🏆</button>
            <button class="tool-btn" id="btn-reset" title="开球">🔄</button>
        </div>

        <div id="touch-left"></div>
        <div id="touch-right"></div>

        <div class="modal-backdrop" id="modal-cover">
            <div class="modal-card">
                <div class="modal-title">📱 微信小游戏启动海报</div>
                <img src="assets/ui/game_cover.jpg" alt="海报">
                <button class="modal-btn" onclick="closeModals()">开始决战 ⚽</button>
            </div>
        </div>

        <div class="modal-backdrop" id="modal-share">
            <div class="modal-card">
                <div class="modal-title">🏆 微信小游戏战报卡片</div>
                <img src="assets/ui/share_card.jpg" alt="战报">
                <button class="modal-btn" onclick="closeModals()">重返球场</button>
            </div>
        </div>
    </div>

    <!-- 离线 3D 渲染核心 -->
    <script src="libs/three.min.js"></script>

    <script>
        /* ==========================================================================
           1. 音效引擎
           ========================================================================== */
        const Sound = {
            enabled: true,
            audioCtx: null,
            buffers: {},
            comboNotes: [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3],
            init() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.audioCtx = new AudioContext();
                    }
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.load('flipper', 'assets/audio/flipper.wav');
                this.load('kick', 'assets/audio/kick.wav');
                this.load('kick_crit', 'assets/audio/kick_crit.wav');
                this.load('bounce', 'assets/audio/bounce.wav');
                this.load('whistle', 'assets/audio/whistle.wav');
                this.load('goal', 'assets/audio/goal.wav');
                this.load('drain', 'assets/audio/drain.wav');
                this.load('net_impact', 'assets/audio/net_impact.wav');
            },
            load(key, url) {
                if (this.buffers[key] || !this.audioCtx) return;
                fetch(url)
                    .then(r => r.arrayBuffer())
                    .then(buf => this.audioCtx.decodeAudioData(buf))
                    .then(decoded => { this.buffers[key] = decoded; })
                    .catch(() => {});
            },
            play(key, vol = 1.0, pitchRate = 1.0) {
                if (!this.enabled) return;
                this.init();
                if (!this.audioCtx) return;
                if (this.buffers[key]) {
                    const src = this.audioCtx.createBufferSource();
                    src.buffer = this.buffers[key];
                    src.playbackRate.value = pitchRate;
                    const gain = this.audioCtx.createGain();
                    gain.gain.value = vol;
                    src.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    src.start(0);
                } else {
                    this.playSynth(key, vol, pitchRate);
                }
            },
            playComboNote(comboCount) {
                if (!this.enabled) return;
                this.init();
                if (!this.audioCtx) return;
                const now = this.audioCtx.currentTime;
                const noteIdx = Math.min(comboCount, this.comboNotes.length - 1);
                const freq = this.comboNotes[noteIdx];

                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.35, now + 0.12);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.005, now + 0.12);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            },
            playSynth(key, vol, pitchRate) {
                if (!this.audioCtx) return;
                const now = this.audioCtx.currentTime;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                if (key === 'flipper') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.07);
                    gain.gain.setValueAtTime(0.4 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
                } else if (key === 'kick_crit') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(110 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(32, now + 0.28);
                    gain.gain.setValueAtTime(0.7 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                } else if (key === 'whistle') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(2850 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(2980 * pitchRate, now + 0.2);
                    gain.gain.setValueAtTime(0.3 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                } else if (key === 'goal') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(330 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(523, now + 0.4);
                    gain.gain.setValueAtTime(0.35 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                } else if (key === 'drain') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
                    gain.gain.setValueAtTime(0.4 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                } else if (key === 'bounce') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                    gain.gain.setValueAtTime(0.3 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                } else if (key === 'net_impact') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(90 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(34, now + 0.35);
                    gain.gain.setValueAtTime(0.75 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(160 * pitchRate, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
                    gain.gain.setValueAtTime(0.45 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                }
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        };

        /* ==========================================================================
           2. 核心几何与防遮挡构图（全场整体下移，球门 100% 露出一目了然！）
           ========================================================================== */
        const G = {
            halfW: 7.6,
            topZ: -12.5,        // 球门整体微下移，彻底摆脱顶部文字遮挡！
            funnelTopZ: 9.5,
            pivotZ: 14.5,
            pivotX: 4.1,        // 拉大危险孔径，确保真实漏球失败判定
            flipperL: 3.2,
            restAngle: 0.38,
            activeAngle: -0.65,
            strikeSpeed: 48,
            ballR: 0.52,
            tableTiltGravityZ: 5.2
        };

        let scene, camera, renderer;
        let ball = {
            mesh: null,
            x: 0, y: G.ballR, z: 2,
            vx: 0, vy: 0, vz: 14,
            speed: 0
        };

        let leftFlipper = {
            px: -G.pivotX, pz: G.pivotZ,
            angle: G.restAngle, targetAngle: G.restAngle,
            omega: 0, mesh: null
        };
        let rightFlipper = {
            px: G.pivotX, pz: G.pivotZ,
            angle: -G.restAngle, targetAngle: -G.restAngle,
            omega: 0, mesh: null
        };

        const walls = [];
        let keyState = { left: false, right: false };
        let scoreP1 = 2, scoreCPU = 0;
        let countdown = 54;
        let countdownMesh;
        let pitchMesh = null;
        let pitchLineMat = null;
        const PITCH_STYLES = [
            { id: 'zebra', name: '经典斑马横条纹', icon: '🌿' },
            { id: 'checker', name: '英超棋盘方格', icon: '🏁' },
            { id: 'diamond', name: '大师菱性格纹', icon: '💎' }
        ];
        let currentPitchStyleIdx = 0;
        let pitchToastTimer = null;

        let characters = [];
        let particles = [];
        let ballTrailParticles = [];
        let textures = {};
        let currentSkin = 'classic';

        let comboCount = 0;
        let comboResetTimer = 0;
        let screenShake = 0;
        let bulletTimeTimer = 0;
        let goalCelebrationTimer = 0;
        let baseCamPos = new THREE.Vector3(0, 52, 11.5);

        // 宏伟球场全景氛围全局引用 (源自前期高精插画：看台天幕/环场LED/金杯展台/礼花系统)
        let ledTexLeft = null, ledTexRight = null;
        let stadiumTrophyMesh = null;
        const stadiumConfettiPool = [];
        const stadiumSpectators = [];
        const stadiumFlags = [];

        /* ==========================================================================
           真实球网质点弹簧软体物理引擎 (Verlet Soft-Body Goal Net Simulation)
           ========================================================================== */
        const goalState = {
            active: false,
            timer: 0,
            netSoundPlayed: false
        };

        const topGoalNet = {
            mesh: null,
            particles: [],
            springs: [],
            nx: 16,
            ny: 8,
            w: 6.8,
            h: 2.74,
            centerY: 1.43,
            centerZ: G.topZ - 2.2, // -14.7
            init(mesh) {
                this.mesh = mesh;
                this.particles = [];
                this.springs = [];
                for (let j = 0; j <= this.ny; j++) {
                    for (let i = 0; i <= this.nx; i++) {
                        const lx = -this.w / 2 + (i / this.nx) * this.w;
                        const ly = this.h / 2 - (j / this.ny) * this.h;
                        const wx = lx;
                        const wy = this.centerY + ly;
                        const wz = this.centerZ;
                        const isPinned = (i === 0 || i === this.nx || j === 0 || j === this.ny);
                        this.particles.push({
                            curr: new THREE.Vector3(wx, wy, wz),
                            prev: new THREE.Vector3(wx, wy, wz),
                            rest: new THREE.Vector3(wx, wy, wz),
                            isPinned: isPinned
                        });
                    }
                }
                for (let j = 0; j <= this.ny; j++) {
                    for (let i = 0; i <= this.nx; i++) {
                        const idx = j * (this.nx + 1) + i;
                        if (i < this.nx) {
                            const rightIdx = j * (this.nx + 1) + (i + 1);
                            const d = this.particles[idx].rest.distanceTo(this.particles[rightIdx].rest);
                            this.springs.push({ a: idx, b: rightIdx, restLen: d, stiffness: 0.88 });
                        }
                        if (j < this.ny) {
                            const downIdx = (j + 1) * (this.nx + 1) + i;
                            const d = this.particles[idx].rest.distanceTo(this.particles[downIdx].rest);
                            this.springs.push({ a: idx, b: downIdx, restLen: d, stiffness: 0.88 });
                        }
                        if (i < this.nx && j < this.ny) {
                            const d1 = (j + 1) * (this.nx + 1) + (i + 1);
                            const d = this.particles[idx].rest.distanceTo(this.particles[d1].rest);
                            this.springs.push({ a: idx, b: d1, restLen: d, stiffness: 0.45 });
                        }
                        if (i > 0 && j < this.ny) {
                            const d2 = (j + 1) * (this.nx + 1) + (i - 1);
                            const d = this.particles[idx].rest.distanceTo(this.particles[d2].rest);
                            this.springs.push({ a: idx, b: d2, restLen: d, stiffness: 0.45 });
                        }
                    }
                }
            },
            update(dt, ballObj) {
                if (!this.mesh) return 0;
                const damping = 0.042;
                const restoreK = 135.0;
                
                // 1. Verlet Integration (质点动力学积分)
                for (let k = 0; k < this.particles.length; k++) {
                    const p = this.particles[k];
                    if (p.isPinned) continue;
                    const vx = (p.curr.x - p.prev.x) * (1 - damping);
                    const vy = (p.curr.y - p.prev.y) * (1 - damping);
                    const vz = (p.curr.z - p.prev.z) * (1 - damping);

                    const ax = -restoreK * (p.curr.x - p.rest.x);
                    const ay = -restoreK * (p.curr.y - p.rest.y) - 1.0;
                    const az = -restoreK * (p.curr.z - p.rest.z);

                    const nx = p.curr.x + vx + ax * dt * dt;
                    const ny = p.curr.y + vy + ay * dt * dt;
                    const nz = p.curr.z + vz + az * dt * dt;

                    p.prev.copy(p.curr);
                    p.curr.set(nx, ny, nz);
                }

                // 2. Distance Constraints (3 轮弹簧张力松弛，传递同心圆波浪)
                for (let iter = 0; iter < 3; iter++) {
                    for (let s = 0; s < this.springs.length; s++) {
                        const sp = this.springs[s];
                        const pA = this.particles[sp.a];
                        const pB = this.particles[sp.b];
                        const dx = pB.curr.x - pA.curr.x;
                        const dy = pB.curr.y - pA.curr.y;
                        const dz = pB.curr.z - pA.curr.z;
                        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
                        const diff = (dist - sp.restLen) / dist * 0.5 * sp.stiffness;
                        if (!pA.isPinned) {
                            pA.curr.x += dx * diff;
                            pA.curr.y += dy * diff;
                            pA.curr.z += dz * diff;
                        }
                        if (!pB.isPinned) {
                            pB.curr.x -= dx * diff;
                            pB.curr.y -= dy * diff;
                            pB.curr.z -= dz * diff;
                        }
                    }
                }

                // 3. Collision with Ball (足球撞网深陷凹陷与反作用力)
                let hits = 0;
                const collR = G.ballR + 0.14;
                for (let k = 0; k < this.particles.length; k++) {
                    const p = this.particles[k];
                    const dx = p.curr.x - ballObj.x;
                    const dy = p.curr.y - ballObj.y;
                    const dz = p.curr.z - ballObj.z;
                    const distSq = dx * dx + dy * dy + dz * dz;
                    if (distSq < collR * collR) {
                        const dist = Math.sqrt(distSq) || 1e-6;
                        const overlap = collR - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const nz = dz / dist;

                        if (!p.isPinned) {
                            p.curr.x += nx * overlap * 0.95;
                            p.curr.y += ny * overlap * 0.95;
                            p.curr.z += nz * overlap * 0.95;
                        }

                        // 足球动能耗散与网绳反弹
                        ballObj.vx -= nx * overlap * 30.0 * dt;
                        ballObj.vy -= ny * overlap * 30.0 * dt;
                        ballObj.vz -= nz * overlap * 30.0 * dt;

                        ballObj.vx *= (1 - 10.0 * dt);
                        ballObj.vy *= (1 - 10.0 * dt);
                        ballObj.vz *= (1 - 24.0 * dt);

                        hits++;
                    }
                }

                // 4. 直接原地更新 GPU 顶点缓冲区 (0 GC)
                const posAttr = this.mesh.geometry.attributes.position;
                const arr = posAttr.array;
                for (let k = 0; k < this.particles.length; k++) {
                    arr[k * 3 + 0] = this.particles[k].curr.x;
                    arr[k * 3 + 1] = this.particles[k].curr.y - this.centerY;
                    arr[k * 3 + 2] = this.particles[k].curr.z - this.centerZ;
                }
                posAttr.needsUpdate = true;
                this.mesh.geometry.computeVertexNormals();

                return hits;
            },
            reset() {
                if (!this.mesh) return;
                for (let k = 0; k < this.particles.length; k++) {
                    this.particles[k].curr.copy(this.particles[k].rest);
                    this.particles[k].prev.copy(this.particles[k].rest);
                }
                const posAttr = this.mesh.geometry.attributes.position;
                const arr = posAttr.array;
                for (let k = 0; k < this.particles.length; k++) {
                    arr[k * 3 + 0] = this.particles[k].curr.x;
                    arr[k * 3 + 1] = this.particles[k].curr.y - this.centerY;
                    arr[k * 3 + 2] = this.particles[k].curr.z - this.centerZ;
                }
                posAttr.needsUpdate = true;
                this.mesh.geometry.computeVertexNormals();
            }
        };

        /* ==========================================================================
           空气拖尾与击球烟雾粒子系统 (Aerodynamic Vapor & Smoke Particle System)
           ========================================================================== */
        let ballSlipstreamTimer = 0;
        let ballSlipstreamCrit = false;

        let smokeTexture = null;
        function getSmokeTexture() {
            if (smokeTexture) return smokeTexture;
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0.00, 'rgba(255, 255, 255, 1.00)');
            grad.addColorStop(0.25, 'rgba(242, 248, 255, 0.82)');
            grad.addColorStop(0.55, 'rgba(220, 240, 255, 0.42)');
            grad.addColorStop(0.80, 'rgba(205, 230, 255, 0.12)');
            grad.addColorStop(1.00, 'rgba(255, 255, 255, 0.00)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(64, 64, 64, 0, Math.PI * 2);
            ctx.fill();
            smokeTexture = new THREE.CanvasTexture(canvas);
            return smokeTexture;
        }

        let goalNetTexture = null;
        function createGoalNetTexture() {
            if (goalNetTexture) return goalNetTexture;
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 512);

            const step = 64; // 8x8 格，标准 FIFA 网眼比例
            // 1. 细微外发光光晕 (模拟尼龙纤维在夜场探照灯下的边缘泛光)
            ctx.lineWidth = 10.0;
            ctx.strokeStyle = 'rgba(215, 235, 255, 0.45)';
            for (let x = 0; x <= 512; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 512);
                ctx.stroke();
            }
            for (let y = 0; y <= 512; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();
            }

            // 2. 纯白实心编织尼龙绳芯 (饱满高光白色绳缆)
            ctx.lineWidth = 6.2;
            ctx.strokeStyle = '#ffffff';
            for (let x = 0; x <= 512; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 512);
                ctx.stroke();
            }
            for (let y = 0; y <= 512; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();
            }

            // 3. 绳网打结网眼节点 (立体饱满圆球形网结)
            ctx.fillStyle = '#ffffff';
            for (let x = 0; x <= 512; x += step) {
                for (let y = 0; y <= 512; y += step) {
                    ctx.beginPath();
                    ctx.arc(x, y, 7.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            goalNetTexture = new THREE.CanvasTexture(canvas);
            goalNetTexture.wrapS = THREE.RepeatWrapping;
            goalNetTexture.wrapT = THREE.RepeatWrapping;
            goalNetTexture.anisotropy = 8;
            return goalNetTexture;
        }

        const SMOKE_POOL_SIZE = 80;
        const smokePool = [];
        let smokeGeo = null;

        function initSmokeSystem() {
            smokeGeo = new THREE.PlaneGeometry(1, 1);
            const tex = getSmokeTexture();
            for (let i = 0; i < SMOKE_POOL_SIZE; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    map: tex,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false,
                    blending: THREE.NormalBlending
                });
                const mesh = new THREE.Mesh(smokeGeo, mat);
                mesh.visible = false;
                scene.add(mesh);
                smokePool.push({
                    mesh,
                    mat,
                    active: false,
                    life: 0,
                    maxLife: 1,
                    initScale: 0.5,
                    targetScale: 1.8,
                    baseOpacity: 0.75,
                    vx: 0, vy: 0, vz: 0
                });
            }
        }

        function spawnSmokePuff(x, y, z, vx, vy, vz, initScale, targetScale, baseOpacity, maxLife, hexColor = 0xffffff) {
            let p = smokePool.find(item => !item.active);
            if (!p) return; // 达到上限安全跳过，绝对零GC卡顿

            p.active = true;
            p.mesh.visible = true;
            p.mesh.position.set(x, y, z);
            p.mesh.scale.setScalar(initScale);
            p.mat.color.setHex(hexColor);
            p.mat.opacity = baseOpacity;
            p.initScale = initScale;
            p.targetScale = targetScale;
            p.baseOpacity = baseOpacity;
            p.life = maxLife;
            p.maxLife = maxLife;
            p.vx = vx;
            p.vy = vy;
            p.vz = vz;
        }

        function spawnImpactSmokeBurst(x, z, nx, nz, isCrit) {
            const count = isCrit ? 14 : 9;
            const col = isCrit ? 0xfef08a : 0xf1f8ff;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 2.5 + Math.random() * 6.0;
                const svx = Math.cos(angle) * spd + nx * 4.0;
                const svz = Math.sin(angle) * spd + nz * 4.0;
                const svy = 0.8 + Math.random() * 2.0;
                spawnSmokePuff(
                    x + (Math.random() - 0.5) * 0.4,
                    0.52,
                    z + (Math.random() - 0.5) * 0.4,
                    svx, svy, svz,
                    0.55 + Math.random() * 0.25,
                    1.75 + Math.random() * 0.50,
                    isCrit ? 0.85 : 0.72,
                    0.45 + Math.random() * 0.18,
                    col
                );
            }
        }

        function updateSmokeSystem(dt) {
            for (let i = 0; i < smokePool.length; i++) {
                const p = smokePool[i];
                if (!p.active) continue;

                p.life -= dt;
                if (p.life <= 0) {
                    p.active = false;
                    p.mesh.visible = false;
                    continue;
                }

                const progress = 1.0 - (p.life / p.maxLife); // 0 -> 1
                p.mesh.quaternion.copy(camera.quaternion);

                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                p.vx *= 0.92;
                p.vz *= 0.92;
                p.vy *= 0.94;

                const scale = p.initScale + (p.targetScale - p.initScale) * Math.sin(progress * Math.PI * 0.5);
                p.mesh.scale.setScalar(scale);

                const fade = Math.pow(1.0 - progress, 1.15);
                p.mat.opacity = p.baseOpacity * fade;
            }
        }

        function initThree() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1322); // 第一版高级深邃纯净 Slate 蓝

            // 精准计算的黄金俯角：FOV 46度保证顶部球门与底部底网同时拥有充足留白，彻底告别遮挡
            camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 500);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            const amb = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(amb);

            // 主探照灯：照射草叶切面形成真实 3D 微观阴影与高光
            const sun = new THREE.DirectionalLight(0xfffaed, 1.45);
            sun.position.set(10, 42, 14);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 10;
            sun.shadow.camera.far = 80;
            sun.shadow.camera.left = -16;
            sun.shadow.camera.right = 16;
            sun.shadow.camera.top = 28;
            sun.shadow.camera.bottom = -28;
            sun.shadow.bias = -0.0006;
            scene.add(sun);

            // 副球场冷白探照灯：营造夜场世界杯立体轮廓反光
            const flood = new THREE.DirectionalLight(0x93c5fd, 0.42);
            flood.position.set(-14, 32, -18);
            scene.add(flood);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                updateCameraPosition();
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 0.6) {
                // 竖屏手机：高度 54，Z轴 14.5，视点对准 0，确保球门两端皆有宽敞空间
                baseCamPos.set(0, 54, 14.5);
                camera.position.copy(baseCamPos);
                camera.lookAt(0, 0, 0.0);
            } else {
                baseCamPos.set(0, 46, 11.0);
                camera.position.copy(baseCamPos);
                camera.lookAt(0, 0, 0.0);
            }
        }

        /* ==========================================================================
           4. 还原第一版纯净、明快、高级的绿茵球场设计 (支持实时无缝切换 3 款大师级草坪)
           ========================================================================== */
        function buildCleanPitch() {
            const pitchW = 16.0, pitchL = 33.0;

            // 1. 配置 2048 级三大草皮纹理各向异性过滤与平铺倍率
            const maxAniso = renderer ? renderer.capabilities.getMaxAnisotropy() : 4;
            ['zebra', 'checker', 'diamond'].forEach(s => {
                ['diffuse', 'normal', 'roughness'].forEach(t => {
                    const tex = textures[`pitch_${s}_${t}`];
                    if (tex) {
                        tex.wrapS = THREE.ClampToEdgeWrapping;
                        tex.wrapT = THREE.ClampToEdgeWrapping;
                        tex.repeat.set(1.0, 1.0);
                        tex.anisotropy = maxAniso;
                    }
                });
            });
            if (textures.grassAO) {
                textures.grassAO.wrapS = THREE.ClampToEdgeWrapping;
                textures.grassAO.wrapT = THREE.ClampToEdgeWrapping;
                textures.grassAO.repeat.set(1.0, 1.0);
                textures.grassAO.anisotropy = maxAniso;
            }

            // 2. 3D 立体草台土壤基底（深色草根泥土倒角，赋予球台真实物理厚度）
            const baseGeo = new THREE.BoxGeometry(pitchW, 0.22, pitchL);
            const baseMat = new THREE.MeshStandardMaterial({
                color: 0x091c0e,
                roughness: 0.95,
                metalness: 0.0
            });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.set(0, -0.11, 1.0);
            scene.add(baseMesh);

            // 3. 顶级 3D 拟真 PBR 绿茵草皮（法线凹凸 + 粗糙度高光 + 根部环境光遮挡）
            const pitchGeo = new THREE.PlaneGeometry(pitchW, pitchL, 32, 64);
            pitchGeo.setAttribute('uv2', new THREE.BufferAttribute(pitchGeo.attributes.uv.array, 2));

            const cur = PITCH_STYLES[currentPitchStyleIdx];
            const pitchMat = new THREE.MeshStandardMaterial({
                map: textures[`pitch_${cur.id}_diffuse`] || null,
                normalMap: textures[`pitch_${cur.id}_normal`] || null,
                normalScale: new THREE.Vector2(2.5, 2.5),   // 强劲的 3D 草丝立面阴影与立体感
                roughnessMap: textures[`pitch_${cur.id}_roughness`] || null,
                roughness: 0.65,
                aoMap: textures.grassAO || null,
                aoMapIntensity: 1.35,                       // 拟真草根深色凹陷接触阴影
                metalness: 0.03
            });
            pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
            pitchMesh.rotation.x = -Math.PI / 2;
            pitchMesh.position.set(0, 0.01, 1.0);
            pitchMesh.receiveShadow = true;
            scene.add(pitchMesh);

            // 4. 白色嵌入式草皮标线（微反光、吸附草叶法线起伏，告别浮空贴纸感）
            pitchLineMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.45,
                metalness: 0.05,
                opacity: 0.92,
                transparent: true,
                normalMap: textures[`pitch_${cur.id}_normal`] || null,
                normalScale: new THREE.Vector2(1.2, 1.2)
            });

            // 中线
            const mid = new THREE.Mesh(new THREE.PlaneGeometry(G.halfW * 2, 0.16), pitchLineMat);
            mid.rotation.x = -Math.PI / 2;
            mid.position.set(0, 0.02, 0);
            scene.add(mid);

            // 中圈圆环
            const ring = new THREE.Mesh(new THREE.RingGeometry(2.8, 3.0, 64), pitchLineMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(0, 0.02, 0);
            scene.add(ring);

            createCountdownBadge();
            buildBox(0, G.topZ + 3.0, 8.4, 4.2, pitchLineMat);
        }

            const diffTex = textures[`pitch_${style.id}_diffuse`];

                pitchMesh.material.normalMap = normTex || null;

        function updateCountdownTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 84px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(countdown), 64, 64);

        /* ==========================================================================
           5. 洁白圆管流线护栏 (Smooth Tubing Bumper Rails)
           ========================================================================== */
        function buildSmoothRails() {
            const railMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.15,
                metalness: 0.2
            });

            const r = 0.35;
            const hw = G.halfW;
            const goalW = 6.8;

            addCylinderRail(-hw + 1.2, G.topZ, -goalW / 2, G.topZ, r, railMat);
            addCylinderRail(goalW / 2, G.topZ, hw - 1.2, G.topZ, r, railMat);

            addCornerArc(-hw + 1.2, G.topZ + 1.2, 1.2, Math.PI * 1.5, Math.PI, r, railMat);
            addCornerArc(hw - 1.2, G.topZ + 1.2, 1.2, Math.PI * 1.5, Math.PI * 2.0, r, railMat);

            addCylinderRail(-hw, G.topZ + 1.2, -hw, G.funnelTopZ, r, railMat);
            addCylinderRail(hw, G.topZ + 1.2, hw, G.funnelTopZ, r, railMat);

            addCylinderRail(-hw, G.funnelTopZ, -G.pivotX, G.pivotZ, r, railMat);
            addCylinderRail(hw, G.funnelTopZ, G.pivotX, G.pivotZ, r, railMat);

            [-G.pivotX, G.pivotX].forEach(x => {
                const post = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.48, 0.48, 1.0, 24),
                    new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.5, roughness: 0.2 })
                );
                post.position.set(x, 0.5, G.pivotZ);
                post.castShadow = true;
                scene.add(post);
            });
        }

        function addCylinderRail(x1, z1, x2, z2, r, mat) {
            const p1 = new THREE.Vector3(x1, r + 0.15, z1);
            const p2 = new THREE.Vector3(x2, r + 0.15, z2);
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            if (len < 0.001) return;

            const geo = new THREE.CylinderGeometry(r, r, len, 20);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(p1).addScaledVector(dir, 0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            walls.push({ x1, z1, x2, z2, r });
        }

        function addCornerArc(cx, cz, radius, a1, a2, r, mat) {
            const steps = 8;
            let prevX = cx + Math.cos(a1) * radius;
            let prevZ = cz + Math.sin(a1) * radius;
            for (let i = 1; i <= steps; i++) {
                const a = a1 + (a2 - a1) * (i / steps);
                const curX = cx + Math.cos(a) * radius;
                const curZ = cz + Math.sin(a) * radius;
                addCylinderRail(prevX, prevZ, curX, curZ, r, mat);
                prevX = curX;
                prevZ = curZ;
            }
        }

        function buildFlippers() {

        function makePaddle(len, mat, isRight) {
            const grp = new THREE.Group();
            const shape = new THREE.Shape();
            const rBase = 0.45;
            const rTip = 0.24;
            shape.moveTo(0, -rBase);
            shape.lineTo(len - rTip, -rTip);
            shape.absarc(len - rTip, 0, rTip, -Math.PI / 2, Math.PI / 2, false);
            shape.lineTo(0, rBase);
            shape.absarc(0, 0, rBase, Math.PI / 2, -Math.PI / 2, false);

            const extrudeSettings = { depth: 0.7, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.06, bevelThickness: 0.06 };
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI / 2;
            mesh.position.y = 0.35;
            if (isRight) mesh.scale.set(-1, 1, 1);
            mesh.castShadow = true;
            grp.add(mesh);

            return grp;
        }

        function buildGoals() {
            const postMat = new THREE.MeshStandardMaterial({

        function buildGoal(cx, cz, w, h, d, postMat, netMat, isTop) {
            const g = new THREE.Group();
            const sign = isTop ? -1 : 1;
            const postR = 0.12;
            const barR = 0.07;
            const netYBottom = 0.06;
            const netH = h - netYBottom;
            const netTex = createGoalNetTexture();

            // 1. 前门框：两侧主立柱
            const p1 = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, h, 24), postMat);
            p1.position.set(-w / 2, h / 2, 0);
            p1.castShadow = true;
            g.add(p1);

            const p2 = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, h, 24), postMat);
            p2.position.set(w / 2, h / 2, 0);
            p2.castShadow = true;
            g.add(p2);

            // 2. 前门框：主横梁
            const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, w, 24), postMat);
            crossbar.rotation.z = Math.PI / 2;
            crossbar.position.set(0, h, 0);
            crossbar.castShadow = true;
            g.add(crossbar);

            // 3. 转角圆角弯头 (Elbow joints)
            const elbowL = new THREE.Mesh(new THREE.SphereGeometry(postR, 16, 16), postMat);
            elbowL.position.set(-w / 2, h, 0);
            g.add(elbowL);

            const elbowR = new THREE.Mesh(new THREE.SphereGeometry(postR, 16, 16), postMat);
            elbowR.position.set(w / 2, h, 0);
            g.add(elbowR);

            // 4. 欧式箱式球门后拉杆系统 (Stanchion Support Frame)
            // 4.1 顶部水平后拉杆 (Top stay arms)
            const topStayL = new THREE.Mesh(new THREE.CylinderGeometry(barR, barR, d, 16), postMat);
            topStayL.rotation.x = Math.PI / 2;
            topStayL.position.set(-w / 2, h, sign * d / 2);
            g.add(topStayL);

            const topStayR = new THREE.Mesh(new THREE.CylinderGeometry(barR, barR, d, 16), postMat);
            topStayR.rotation.x = Math.PI / 2;
            topStayR.position.set(w / 2, h, sign * d / 2);
            g.add(topStayR);

            // 4.2 后方顶部横撑杆 (Rear top crossbar)
            const rearTopBar = new THREE.Mesh(new THREE.CylinderGeometry(barR, barR, w, 16), postMat);
            rearTopBar.rotation.z = Math.PI / 2;
            rearTopBar.position.set(0, h, sign * d);
            g.add(rearTopBar);

            // 4.3 地面侧边框 (Ground side rails)
            const groundSideL = new THREE.Mesh(new THREE.CylinderGeometry(barR, barR, d, 16), postMat);
            groundSideL.rotation.x = Math.PI / 2;
            groundSideL.position.set(-w / 2, netYBottom, sign * d / 2);
            g.add(groundSideL);

            const groundSideR = new THREE.Mesh(new THREE.CylinderGeometry(barR, barR, d, 16), postMat);
            groundSideR.rotation.x = Math.PI / 2;
            groundSideR.position.set(w / 2, netYBottom, sign * d / 2);
            g.add(groundSideR);

            // 4.4 地面后横杆 (Ground rear anchor rail)
            const groundRearBar = new THREE.Mesh(new THREE.CylinderGeometry(barR, barR, w, 16), postMat);
            groundRearBar.rotation.z = Math.PI / 2;
            groundRearBar.position.set(0, netYBottom, sign * d);
            g.add(groundRearBar);

            // 4.5 刚性斜撑桁架 (Diagonal reinforcement braces)
            const braceLen = Math.hypot(d * 0.85, h);
            const braceAngle = Math.atan2(d * 0.85, h);

            const braceL = new THREE.Mesh(new THREE.CylinderGeometry(barR * 0.85, barR * 0.85, braceLen, 16), postMat);
            braceL.rotation.x = sign * braceAngle;
            braceL.position.set(-w / 2, h / 2, sign * (d * 0.85) / 2);
            g.add(braceL);

            const braceR = new THREE.Mesh(new THREE.CylinderGeometry(barR * 0.85, barR * 0.85, braceLen, 16), postMat);
            braceR.rotation.x = sign * braceAngle;
            braceR.position.set(w / 2, h / 2, sign * (d * 0.85) / 2);
            g.add(braceR);

            // 5. 拟真尼龙编织织网多面板 (顶网、左网、右网、后网)
            function makeNetPanelMat(repU, repV) {
                const tex = netTex.clone();
                tex.repeat.set(repU, repV);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.needsUpdate = true;
                return new THREE.MeshStandardMaterial({
                    map: tex,
                    transparent: true,
                    alphaTest: 0.10,
                    side: THREE.DoubleSide,
                    color: 0xffffff,
                    roughness: 0.58,
                    metalness: 0.04
                });
            }

            // 5.1 顶网 (Roof net)
            const roofGeo = new THREE.PlaneGeometry(w, d, 12, 6);
            const roofMesh = new THREE.Mesh(roofGeo, makeNetPanelMat(7, 2.5));
            roofMesh.rotation.x = Math.PI / 2;
            roofMesh.position.set(0, h, sign * d / 2);
            g.add(roofMesh);

            // 5.2 左侧网 (Left side net)
            const sideLGeo = new THREE.PlaneGeometry(d, netH, 6, 8);
            const sideLMesh = new THREE.Mesh(sideLGeo, makeNetPanelMat(2.5, 3));
            sideLMesh.rotation.y = Math.PI / 2;
            sideLMesh.position.set(-w / 2, (h + netYBottom) / 2, sign * d / 2);
            g.add(sideLMesh);

            // 5.3 右侧网 (Right side net)
            const sideRGeo = new THREE.PlaneGeometry(d, netH, 6, 8);
            const sideRMesh = new THREE.Mesh(sideRGeo, makeNetPanelMat(2.5, 3));
            sideRMesh.rotation.y = -Math.PI / 2;
            sideRMesh.position.set(w / 2, (h + netYBottom) / 2, sign * d / 2);
            g.add(sideRMesh);

            // 5.4 后网 (Back wall net)
            const backGeo = new THREE.PlaneGeometry(w, netH, 16, 8);
            const backMesh = new THREE.Mesh(backGeo, makeNetPanelMat(7, 3));
            backMesh.position.set(0, (h + netYBottom) / 2, sign * d);
            if (!isTop) {
                backMesh.rotation.y = Math.PI;
            }
            g.add(backMesh);

            g.position.set(cx, 0, cz);
            scene.add(g);

            if (isTop) {
                topGoalNet.init(backMesh);
            }
        }

           - 源自前期精美插画与分享卡资产提炼

           ========================================================================== */
        function createFlareTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            grad.addColorStop(0.25, 'rgba(186, 230, 253, 0.85)');
            grad.addColorStop(0.55, 'rgba(56, 189, 248, 0.25)');
            grad.addColorStop(1, 'rgba(11, 19, 34, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
